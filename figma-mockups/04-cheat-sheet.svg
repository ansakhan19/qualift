  <rect x="1082" y="380" width="86" height="38" rx="8" fill="#FFFFFF" stroke="#E7E0D5"/>
  <text x="1125" y="404" text-anchor="middle" font-size="12" fill="#4338CA" font-weight="500">⧉ Copy</text>

