  <text x="1125" y="282" text-anchor="middle" font-size="12" fill="#4338CA" font-weight="500">⧉ Copy</text>
  <text x="652" y="316" font-size="11" fill="#78350F">Must match your passport, state ID, or IDNYC exactly.</text>

