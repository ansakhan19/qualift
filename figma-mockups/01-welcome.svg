<svg width="560" height="880" viewBox="0 0 560 880" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <rect width="560" height="880" fill="#FAF6EF"/>
  <rect x="50" y="40" width="460" height="800" rx="16" fill="#FFFFFF" stroke="#E7E0D5"/>

  <rect x="254" y="80" width="52" height="52" rx="14" fill="#4F46E5"/>
  <path d="M285 92 l-14 22 h10 l-6 20 16 -24 h-10 z" fill="#FFFFFF"/>

  <text x="280" y="166" text-anchor="middle" font-size="14" fill="#4338CA" font-weight="500">Hi there 👋</text>
  <text x="280" y="198" text-anchor="middle" font-size="23" fill="#1E1B2E" font-weight="600" font-family="Bricolage Grotesque, Inter, sans-serif">Let's get you 50% off every</text>
  <text x="280" y="228" text-anchor="middle" font-size="23" fill="#1E1B2E" font-weight="600" font-family="Bricolage Grotesque, Inter, sans-serif">subway and bus ride</text>

  <text x="280" y="260" text-anchor="middle" font-size="13" fill="#7C7365">Answer a few questions, about 10 minutes. We'll tell you</text>
  <text x="280" y="280" text-anchor="middle" font-size="13" fill="#7C7365">if you qualify and walk you through the whole application.</text>

  <rect x="140" y="304" width="280" height="42" rx="21" fill="#EAF2EB"/>
  <text x="280" y="330" text-anchor="middle" font-size="13" fill="#3A5440">Most students save about  $780/year</text>

  <rect x="80" y="370" width="128" height="70" rx="12" fill="#EEF2FF"/>
  <text x="144" y="400" text-anchor="middle" font-size="17" fill="#3730A3" font-weight="500">$1.50</text>
  <text x="144" y="420" text-anchor="middle" font-size="10.5" fill="#4338CA">per ride, was $3.00</text>

  <rect x="216" y="370" width="128" height="70" rx="12" fill="#EEF2FF"/>
  <text x="280" y="400" text-anchor="middle" font-size="17" fill="#3730A3" font-weight="500">$17.50</text>
  <text x="280" y="420" text-anchor="middle" font-size="10.5" fill="#4338CA">weekly cap, was $35</text>

  <rect x="352" y="370" width="128" height="70" rx="12" fill="#EEF2FF"/>
  <text x="416" y="400" text-anchor="middle" font-size="17" fill="#3730A3" font-weight="500">Any visa</text>
  <text x="416" y="420" text-anchor="middle" font-size="10.5" fill="#4338CA">no public charge</text>

  <rect x="80" y="470" width="400" height="54" rx="12" fill="#4F46E5"/>
  <text x="280" y="503" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="500">See if I qualify</text>

  <text x="280" y="548" text-anchor="middle" font-size="11" fill="#A69D8D">Free · no account needed · nothing is stored</text>

  <line x1="80" y1="580" x2="245" y2="580" stroke="#E7E0D5"/>
  <text x="280" y="584" text-anchor="middle" font-size="11" fill="#A69D8D">already started?</text>
  <line x1="315" y1="580" x2="480" y2="580" stroke="#E7E0D5"/>

  <rect x="80" y="608" width="400" height="130" rx="12" fill="#FAF6EF" stroke="#E7E0D5"/>
  <text x="100" y="638" font-size="12" fill="#5C5548" font-weight="500">Continue where you left off</text>
  <text x="100" y="660" font-size="11" fill="#A69D8D">Enter your email and we'll send a link to resume on any device.</text>
  <rect x="100" y="676" width="270" height="40" rx="9" fill="#FFFFFF" stroke="#E7E0D5"/>
  <text x="114" y="700" font-size="12" fill="#A69D8D">your@email.com</text>
  <rect x="382" y="676" width="78" height="40" rx="9" fill="#4F46E5"/>
  <text x="421" y="700" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="500">Send</text>

  <text x="280" y="790" text-anchor="middle" font-size="10.5" fill="#A69D8D">Qualift is free and not affiliated with HRA or the MTA.</text>
  <text x="280" y="806" text-anchor="middle" font-size="10.5" fill="#A69D8D">Your email is only used to restore your progress.</text>
